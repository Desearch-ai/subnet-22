[package]
name = "desearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "What the Desearch Rust services share: URL canonicalisation, R2, numbered feeds, outcome files, hotkeys and the chain client"

[dependencies]
anyhow = "1"
arrow-array = "59"
arrow-schema = "59"
bip39 = { version = "2", default-features = false, features = ["std"] }
blake2 = "0.10"
bs58 = "0.5"
bytes = "1"
frame-metadata = { version = "23", default-features = false, features = ["current", "decode", "std"], optional = true }
futures = "0.3"
hmac = "0.12"
parity-scale-codec = { version = "3", default-features = false, features = ["std"], optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scale-info = { version = "2", default-features = false, features = ["std", "decode"], optional = true }
scale-value = { version = "0.18", optional = true }
schnorrkel = "0.11"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
substrate-bip39 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"], optional = true }
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[features]
chain = ["dep:frame-metadata", "dep:parity-scale-codec", "dep:scale-info", "dep:scale-value", "dep:twox-hash", "reqwest/json"]
