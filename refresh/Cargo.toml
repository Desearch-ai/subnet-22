[package]
name = "refresh"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Keeps bulk sources current: runs a source's commands, publishes only its new and changed pages, hides the pages it dropped"

[dependencies]
anyhow = "1"
arrow-array = "59"
arrow-cast = "59"
arrow-schema = "59"
arrow-select = "59"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
libc = "0.2"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap", "lz4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
