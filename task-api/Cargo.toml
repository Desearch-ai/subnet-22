[package]
name = "task-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "The SN22 task API: hands out crawl and embed tasks, takes uploads and verdicts, keeps the accounts"

[dependencies]
anyhow = "1"
arrow-array = "59"
arrow-schema = "59"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tower-log"] }
base64 = "0.22"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures = "0.3"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap"] }
rand = "0.8"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
desearch = { path = "../crates/desearch", features = ["chain"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
