# The task API outside a TEE, on a host of our own:
#   TASK_API_IMAGE_DIGEST=sha256:... docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d
#
# It runs the Rust API from the image CI built from a release tag, named by its digest, never a local
# build: check the digest with task-api/deploy/rebuild.sh or `gh attestation verify` (docs/verify-task-api.md).
# Production runs in a TEE instead, from task-api/deploy/dstack/ (docs/tee.md); this file is the fallback.

x-r2-env: &r2-env
  CF_R2_ENDPOINT: ${CF_R2_ENDPOINT:?set CF_R2_ENDPOINT}
  CF_R2_BUCKET: ${CF_R2_BUCKET:-subnet-22}
  CF_R2_PAGES_BUCKET: ${CF_R2_PAGES_BUCKET:-desearch-pages}
  CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID:?set CF_R2_ACCESS_KEY_ID}
  CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY:?set CF_R2_SECRET_ACCESS_KEY}
  CF_R2_REGION: ${CF_R2_REGION:-auto}
  CF_R2_PUBLIC_OBJECTS: ${CF_R2_PUBLIC_OBJECTS:-0}
  TASK_API_REDIS: ${TASK_API_REDIS:?set the task API Redis URL}

services:
  api:
    image: ghcr.io/desearch-ai/sn22-task-api@${TASK_API_IMAGE_DIGEST:?set the sha256 digest CI printed for the release}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    environment:
      <<: *r2-env
      TASK_API_REGISTRY: chain
      TASK_API_SEEDS: chain
      TASK_API_NETUID: ${TASK_API_NETUID:-22}
      TASK_API_NETWORK: ${TASK_API_NETWORK:-finney}
      TASK_API_ADMIN_HOTKEYS: ${TASK_API_ADMIN_HOTKEYS:?set the ss58 hotkeys allowed to enqueue}
      TASK_API_KEY_URI: ${TASK_API_KEY_URI:?set the secret receipts are signed with}
      TASK_API_DATA: /data
      TASK_API_CORS_ORIGINS: ${TASK_API_CORS_ORIGINS:-}
      TASK_API_EMBED_TASKS: ${TASK_API_EMBED_TASKS:-0}
      TASK_API_EMBED_MODEL: ${TASK_API_EMBED_MODEL:-desearch-4b-v1}
      TASK_API_QUEUE_TARGET: ${TASK_API_QUEUE_TARGET:-1200}
    volumes: ["api-data:/data"]
    ports: ["${TASK_API_BIND:-127.0.0.1:8080}:8080"]
    networks: [coolify]
    # The image's own check, spelled out: /v1/ping answers once the subnet's hotkeys are loaded.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  api-data:

# Redis is its own Coolify resource on this network. In the TEE it runs inside the CVM instead.
networks:
  coolify:
    external: true
